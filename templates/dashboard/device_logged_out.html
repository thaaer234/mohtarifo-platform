{% extends "dashboard/base.html" %}

{% block title %}تنبيه أمان | محترفو التعليم{% endblock %}

{% block content %}
<section class="device-logout-page" dir="rtl">
    <div class="device-logout-shell">
        <div class="device-logout-visual" aria-hidden="true">
            <svg viewBox="0 0 520 420" role="img" class="device-logout-svg">
                <defs>
                    <linearGradient id="deviceScreen" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#fff7df"/>
                        <stop offset="48%" stop-color="#f4d17b"/>
                        <stop offset="100%" stop-color="#8f6f3e"/>
                    </linearGradient>
                    <linearGradient id="deviceBody" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#1d2433"/>
                        <stop offset="100%" stop-color="#0c111d"/>
                    </linearGradient>
                    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
                        <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0c111d" flood-opacity="0.22"/>
                    </filter>
                </defs>

                <path d="M86 314c-35-38-45-102-15-153 31-54 91-71 137-88 53-20 92-44 151-18 59 27 89 91 78 151-11 61-62 102-116 125-72 31-176 45-235-17z" fill="#f5efe2"/>
                <path d="M97 320c75 50 258 50 331-2" fill="none" stroke="#d8c492" stroke-width="10" stroke-linecap="round" opacity=".55"/>

                <g filter="url(#softShadow)">
                    <rect x="143" y="78" width="234" height="284" rx="34" fill="url(#deviceBody)"/>
                    <rect x="160" y="103" width="200" height="221" rx="22" fill="url(#deviceScreen)"/>
                    <circle cx="260" cy="342" r="8" fill="#f7e6b1"/>
                </g>

                <g transform="translate(201 146)">
                    <path d="M59 0c37 0 67 30 67 67s-30 67-67 67S-8 104-8 67 22 0 59 0z" fill="#fffaf0" opacity=".92"/>
                    <path d="M59 22c18 0 32 14 32 32v16h8c5 0 9 4 9 9v36c0 5-4 9-9 9H19c-5 0-9-4-9-9V79c0-5 4-9 9-9h8V54c0-18 14-32 32-32zm0 18c-8 0-14 6-14 14v16h28V54c0-8-6-14-14-14z" fill="#8f6f3e"/>
                    <path d="M81 93 38 50" stroke="#b42318" stroke-width="13" stroke-linecap="round"/>
                    <path d="M38 93 81 50" stroke="#b42318" stroke-width="13" stroke-linecap="round"/>
                </g>

                <g opacity=".9">
                    <circle cx="105" cy="118" r="12" fill="#8f6f3e"/>
                    <circle cx="419" cy="103" r="9" fill="#c89b3c"/>
                    <circle cx="403" cy="289" r="13" fill="#f0d184"/>
                    <path d="M103 210h55M363 162h47M92 257h37" stroke="#c2aa72" stroke-width="9" stroke-linecap="round"/>
                </g>
            </svg>
        </div>

        <div class="device-logout-copy">
            <span class="device-logout-kicker">
                <i data-lucide="shield-alert"></i>
                تنبيه أمان
            </span>
            <h1>تم تسجيل خروجك</h1>
            <p class="device-logout-message">
                تم تسجيل خروجك لأن هذا الحساب تم فتحه من جهاز آخر. إذا لم تكن أنت من قام بذلك، يرجى التواصل مع الدعم فوراً.
            </p>
            <div class="device-logout-actions">
                <a href="{% url 'dashboard:login' %}" class="btn btn-primary">
                    <i data-lucide="log-in"></i>
                    تسجيل الدخول
                </a>
                <a href="{% url 'dashboard:contact' %}" class="btn btn-secondary">
                    <i data-lucide="headphones"></i>
                    التواصل مع الدعم
                </a>
            </div>
        </div>
    </div>
</section>

<style>
    .device-logout-page {
        min-height: calc(100vh - 180px);
        display: grid;
        place-items: center;
        padding: 48px 18px;
        background:
            radial-gradient(circle at 18% 18%, rgba(var(--brand-gold-rgb), 0.14), transparent 28%),
            linear-gradient(135deg, var(--bg-base), var(--bg-surface));
    }

    .device-logout-shell {
        width: min(980px, 100%);
        display: grid;
        grid-template-columns: minmax(280px, 0.9fr) minmax(300px, 1fr);
        align-items: center;
        gap: 36px;
        padding: 34px;
        border: 1px solid var(--border-light);
        border-radius: 28px;
        background: var(--bg-surface-elevated);
        box-shadow: var(--shadow-xl);
    }

    .device-logout-visual {
        display: grid;
        place-items: center;
        min-height: 300px;
    }

    .device-logout-svg {
        width: min(100%, 420px);
        height: auto;
    }

    .device-logout-copy {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 18px;
    }

    .device-logout-kicker {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 9px 13px;
        border-radius: 999px;
        color: var(--brand-gold);
        background: rgba(var(--brand-gold-rgb), 0.12);
        font-weight: 800;
    }

    .device-logout-kicker svg {
        width: 19px;
        height: 19px;
    }

    .device-logout-copy h1 {
        margin: 0;
        color: var(--text-primary);
        font-size: clamp(2.2rem, 5vw, 4.1rem);
        line-height: 1.08;
    }

    .device-logout-message {
        margin: 0;
        color: var(--text-secondary);
        font-size: 1.18rem;
        line-height: 2;
        max-width: 560px;
    }

    .device-logout-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 8px;
    }

    .device-logout-actions .btn {
        min-height: 50px;
        gap: 8px;
    }

    @media (max-width: 820px) {
        .device-logout-page {
            padding: 24px 14px 96px;
        }

        .device-logout-shell {
            grid-template-columns: 1fr;
            padding: 24px;
            gap: 12px;
            border-radius: 22px;
        }

        .device-logout-visual {
            min-height: 220px;
        }

        .device-logout-copy {
            align-items: stretch;
            text-align: right;
        }

        .device-logout-actions {
            flex-direction: column;
        }
    }
</style>
{% endblock %}
