{% extends "base.html" %}
{% block title %}إنشاء حساب جديد{% endblock %}
{% block content %}
<div class="flex-center" style="min-height: 80vh;">
    <div class="premium-card reveal-up" style="max-width: 500px; padding: 3rem; width: 100%;">
        <div class="text-center mb-8">
            <h2 style="font-size: 2rem; margin-bottom: 0.5rem;">انضم إلينا الآن</h2>
            <p class="text-muted">ابدأ رحلتك التعليمية مع نخبة المدرسين</p>
        </div>
        
        <form method="post">
            {% csrf_token %}
            <div class="premium-field">
                <label>اسم المستخدم</label>
                <div class="input-glow-wrapper">
                    <i data-lucide="user" class="field-icon"></i>
                    <input type="text" name="username" placeholder="مثلاً: thaer_2026" required>
                </div>
            </div>

            <div class="premium-field">
                <label>البريد الإلكتروني (اختياري)</label>
                <div class="input-glow-wrapper">
                    <i data-lucide="mail" class="field-icon"></i>
                    <input type="email" name="email" placeholder="email@example.com">
                </div>
            </div>
            
            <div class="grid-2">
                <div class="premium-field">
                    <label>كلمة المرور</label>
                    <div class="input-glow-wrapper password-field">
                        <i data-lucide="lock" class="field-icon"></i>
                        <input type="password" name="password1" placeholder="********" required>
                    </div>
                </div>
                <div class="premium-field">
                    <label>تأكيد كلمة المرور</label>
                    <div class="input-glow-wrapper password-field">
                        <i data-lucide="shield-check" class="field-icon"></i>
                        <input type="password" name="password2" placeholder="********" required>
                    </div>
                </div>
            </div>
            
            <div class="flex-center gap-3 mb-8" style="justify-content: flex-start;">
                <input type="checkbox" id="terms" required style="width: 18px; height: 18px; accent-color: var(--brand-gold);">
                <label for="terms" class="text-muted" style="margin: 0; font-size: 0.85rem; cursor: pointer;">أوافق على <a href="#" class="gold">شروط الاستخدام</a> و <a href="#" class="gold">سياسة الخصوصية</a></label>
            </div>
            
            <button type="submit" class="btn btn-primary btn-glow w-full">إنشاء حسابي</button>
        </form>
        
        <div class="text-center mt-8 pt-8" style="border-top: 1px solid var(--border-light);">
            <p class="text-muted" style="font-size: 0.9rem;">لديك حساب بالفعل؟ <a href="{% url 'dashboard:login' %}" class="gold font-bold">تسجيل الدخول</a></p>
        </div>
    </div>
</div>
{% endblock %}
