{% extends "dashboard/base.html" %}
{% load static %}

{% block title %}عطل فني | محترفو التعليم{% endblock %}

{% block content %}
<div class="flex-center" style="min-height: 60vh; text-align: center;">
    <div class="reveal-up">
        <div class="error-icon mb-6">
            <i data-lucide="server-crash" style="width: 80px; height: 80px; color: var(--danger); filter: drop-shadow(0 0 20px rgba(239, 68, 68, 0.3));"></i>
        </div>
        <h1 style="font-size: 2.5rem; color: #fff; margin: 1.5rem 0;">عذراً، حدث خطأ فني غير متوقع</h1>
        <p style="color: var(--text-secondary); font-size: 1.2rem; max-width: 500px; margin: 0 auto 2.5rem;">فريقنا التقني تلقى بلاغاً بالخطأ وسيقوم بإصلاحه في أسرع وقت ممكن. يرجى المحاولة لاحقاً.</p>
        
        <div class="flex-center gap-6">
            <a href="{% url 'dashboard:home' %}" class="btn btn-primary btn-glow" style="padding: 1rem 2.5rem;">العودة للرئيسية</a>
            <a href="mailto:support@mohtarifo.com" class="btn btn-secondary" style="padding: 1rem 2.5rem;">تبليغ الدعم الفني</a>
        </div>
    </div>
</div>
{% endblock %}
