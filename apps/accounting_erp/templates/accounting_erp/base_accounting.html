<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}النظام المحاسبي - محترفو التعليم{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f9fafb; color: #111827; }
        .bg-edu-green { background-color: #047857; }
        .text-edu-green { color: #047857; }
        .border-edu-green { border-color: #047857; }
        .bg-edu-amber { background-color: #F59E0B; }
        .text-edu-amber { color: #F59E0B; }
    </style>
</head>
<body class="antialiased">
    <!-- Navbar -->
    <nav class="bg-edu-green text-white shadow-xl px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center">
                <span class="text-edu-green font-black text-xl">م</span>
            </div>
            <h1 class="text-xl font-black tracking-tight">محترفو التعليم | النظام المحاسبي</h1>
        </div>
        <div class="flex gap-4">
            <a href="{% url 'accounting_erp:dashboard_root' %}" class="hover:text-edu-amber transition font-bold">الرئيسية</a>
            <a href="{% url 'accounting_erp:chart_tree' %}" class="hover:text-edu-amber transition font-bold">الدليل</a>
            <a href="{% url 'accounting_erp:journal_list' %}" class="hover:text-edu-amber transition font-bold">القيود</a>
            <a href="{% url 'accounting_erp:trial_balance' %}" class="hover:text-edu-amber transition font-bold">الميزان</a>
        </div>
    </nav>

    <main class="p-8">
        {% block accounting_content %}{% endblock %}
    </main>

    <footer class="mt-20 border-t border-neutral-200 py-10 text-center text-neutral-500 text-sm">
        <p>© 2024 محترفو التعليم - نظام الإدارة المالية المتطور</p>
    </footer>
</body>
</html>
