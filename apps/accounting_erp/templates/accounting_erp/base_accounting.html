{% extends 'dashboard/base.html' %}
{% load static humanize %}

{% block extra_css %}
<!-- Dedicated High-Performance Style Injection for the Accounting ERP Module -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          emerald: { 50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7', 400: '#34d399', 500: '#10b981', 600: '#059669', 700: '#047857', 800: '#065f46', 900: '#064e3b' }
        }
      }
    }
  }
</script>
<style>
  /* Correct Tailwind conflict overlaps with existing base classes */
  body, html { font-family: 'Inter', 'Cairo', sans-serif !important; }
  
  /* Prevent Tailwind resetting platform base nav link styling unintentionally */
  .navbar a { all: revert; color: inherit !important; font-family: inherit !important; text-decoration: none !important; display: flex !important; }
  
  /* Custom Dark Mode Bridge: bridge .dark-theme from platform into tailwind's .dark */
  html.dark-theme .dark\:bg-neutral-900 { background-color: rgb(23 23 23) !important; }

  /* =============================================================== */
  /* CRITICAL PRINT PERFORMANCE OVERRIDES (Corporate Ready)           */
  /* =============================================================== */
  /* =============================================================== */
  /* ULTIMATE MASTER PRINT SYSTEM (Pixel-Perfect Corporate A4)       */
  /* =============================================================== */
  @media print {
    /* 1. ABSOLUTE STRUCTURAL RESET - Force DESKTOP WIDTH on paper! */
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 1280px !important; /* CRITICAL: Force Desktop Resolution to stop layout break! */
      min-width: 1280px !important;
      height: auto !important;
      overflow: visible !important;
    }
    
    nav, aside, header.navbar, .navbar, .sidebar, footer, .main-footer, .ambient-bg, .mobile-bottom-nav, .mobile-menu-overlay, .dashboard-sidebar { 
      display: none !important; 
    }

    /* Force main container to occupy the new static 1280px canvas */
    main.main-content, .container, .dashboard-wrapper, .px-4, .py-12, .p-8 { 
      width: 1280px !important; 
      max-width: 1280px !important; 
      margin: 0 auto !important; 
      padding: 0 !important; 
      position: relative !important;
      right: 0 !important;
      left: 0 !important;
      transform: none !important;
    }

    /* 2. REMOVE RESPONSIVE DEGRADATION (Let Shrink-to-fit Handle scaling) */
    /* By forcing 1280px width, the browser renders FULL desktop layout naturally! */


    /* 3. AESTHETIC PRESERVATION */
    * { 
      -webkit-print-color-adjust: exact !important; 
      print-color-adjust: exact !important; 
      color-adjust: exact !important;
      box-shadow: 0 0 10px rgba(0,0,0,0.05) !important; /* Subdue shadows just enough */
      -webkit-filter: none !important; /* Fix blur rendering issues */
    }

    /* Glass Card Safety - Make it solid white with subtle border so it's 100% clean */
    .glass-card, .bg-white\/90, .bg-neutral-900\/50 {
       background-color: #ffffff !important; 
       border: 1px solid #e5e7eb !important;
       opacity: 1 !important;
       color: #000000 !important;
    }
    [data-theme='dark'] .glass-card {
       background-color: #171717 !important;
       border: 1px solid #404040 !important;
       color: #ffffff !important;
    }

    /* 4. PAPER CONFIGURATION */
    @page { 
      margin: 1cm !important; 
      size: A4 landscape; 
    }

    /* Magnificent Watermark */
    .print-watermark {
        display: block !important;
        position: fixed !important;
        top: 50% !important;
        left: 50% !important;
        transform: translate(-50%, -50%) rotate(-15deg) !important;
        width: 600px !important;
        opacity: 0.06 !important;
        z-index: -9999 !important;
        pointer-events: none !important;
    }
    
    /* Fix Table Overflows - Force them onto page width */
    table { width: 100% !important; table-layout: auto !important; page-break-inside: auto; }
    tr    { page-break-inside:avoid; page-break-after:auto }
  }

  
  /* Hide watermark during normal screen usage */
  .print-watermark { display: none; }
</style>
{% endblock %}

{% block content %}
<!-- Invisible on screen, visible as massive central branding watermark on paper -->
<img src="{% static 'dashboard/icons/logo2.png' %}" class="print-watermark" alt="Mohtarifo Watermark">

<div class="dashboard-wrapper">
    {% block accounting_content %}{% endblock %}
</div>
{% endblock %}
