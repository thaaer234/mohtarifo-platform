{% extends 'dashboard/base.html' %}
{% load static humanize %}

{% block extra_css %}
<!-- Dedicated High-Performance Style Injection for the Accounting ERP Module -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          emerald: { 50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7', 400: '#34d399', 500: '#10b981', 600: '#059669', 700: '#047857', 800: '#065f46', 900: '#064e3b' }
        }
      }
    }
  }
</script>
<style>
  /* Correct Tailwind conflict overlaps with existing base classes */
  body, html { font-family: 'Inter', 'Cairo', sans-serif !important; }
  
  /* Prevent Tailwind resetting platform base nav link styling unintentionally */
  .navbar a { all: revert; color: inherit !important; font-family: inherit !important; text-decoration: none !important; display: flex !important; }
  
  /* Custom Dark Mode Bridge: bridge .dark-theme from platform into tailwind's .dark */
  html.dark-theme .dark\:bg-neutral-900 { background-color: rgb(23 23 23) !important; }

  /* =============================================================== */
  /* CRITICAL PRINT PERFORMANCE OVERRIDES (Corporate Ready)           */
  /* =============================================================== */
  @media print {
    /* Hide ALL platform navigation, sidebars, footers, ambient glows, and interaction buttons */
    nav, aside, header.navbar, .navbar, .sidebar, footer, .main-footer, .print\:hidden, button, form, .bg-neutral-900\/50, input, .ambient-bg, .mobile-bottom-nav, .mobile-menu-overlay { 
      display: none !important; 
      height: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    /* Force main content container to utilize 100% of paper without dashboard paddings */
    body, main, .container, .main-content { 
      width: 100% !important; 
      max-width: 100% !important; 
      margin: 0 !important; 
      padding: 0 !important; 
      top: 0 !important;
    }
    
    /* Overrule standard dashboard absolute top spacing for navbar */
    .main-content { padding-top: 0 !important; margin-top: 0 !important; }

    /* Keep original styling beauty (Colors/Shadows) as requested by user */
    * { 
      -webkit-print-color-adjust: exact !important; 
      print-color-adjust: exact !important; 
      color-adjust: exact !important;
    }
    
    /* Switch to Landscape (أفقي) for beautiful wide financial statements */
    @page { 
      margin: 1cm; 
      size: A4 landscape; 
    }

    /* The Magnificent Large Central Watermark */
    .print-watermark {
        display: block !important;
        position: fixed !important;
        top: 50% !important;
        left: 50% !important;
        transform: translate(-50%, -50%) rotate(-15deg) !important;
        width: 600px !important;
        opacity: 0.08 !important;
        z-index: -9999 !important;
        pointer-events: none !important;
    }
  }
  
  /* Hide watermark during normal screen usage */
  .print-watermark { display: none; }
</style>
{% endblock %}

{% block content %}
<!-- Invisible on screen, visible as massive central branding watermark on paper -->
<img src="{% static 'dashboard/icons/logo2.png' %}" class="print-watermark" alt="Mohtarifo Watermark">

<div class="dashboard-wrapper">
    {% block accounting_content %}{% endblock %}
</div>
{% endblock %}
